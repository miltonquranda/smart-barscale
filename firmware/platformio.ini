; PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_BROWNOUT_DET=0
lib_deps = 
	bogde/HX711@^0.7.5
	h2zero/NimBLE-Arduino@^1.4.1
	https://github.com/tobozo/ESP32-USB-Soft-Host.git
	bblanchon/ArduinoJson@^7

; Build these explicitly for the two demo devices. Existing NVS settings take
; precedence, so a unit already configured over BLE is not overwritten.
[env:demo-unit-a]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSMARTBAR_DEFAULT_DEVICE_ID=\"SB_B017B2215788\"

[env:demo-unit-b]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSMARTBAR_DEFAULT_DEVICE_ID=\"SB_A40FB1215788\"
